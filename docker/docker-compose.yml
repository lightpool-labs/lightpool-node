name: venue

networks:
  lightpool:
    ipam:
      config:
        - subnet: 172.28.0.0/16

x-build-proxy: &build-proxy
  # host network so build can reach the host proxy on 127.0.0.1:8118
  network: host
  args:
    HTTP_PROXY: ${HTTP_PROXY:-http://127.0.0.1:8118}
    HTTPS_PROXY: ${HTTPS_PROXY:-http://127.0.0.1:8118}
    http_proxy: ${HTTP_PROXY:-http://127.0.0.1:8118}
    https_proxy: ${HTTPS_PROXY:-http://127.0.0.1:8118}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    no_proxy: ${NO_PROXY:-localhost,127.0.0.1}

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
      <<: *build-proxy
    container_name: lightpool-node
    restart: unless-stopped
    networks:
      lightpool:
        ipv4_address: 172.28.0.2
    ports:
      - "${LP_RPC_PORT:-26300}:26300"
      - "${LP_WS_PORT:-26400}:26400"
      - "${LP_MEMPOOL_PORT:-26000}:26000"
    volumes:
      - ${DATA_DIR:-./data}/node:/data
    environment:
      WALLET_PATH: /data/wallet.json
      STORE_PATH: /data/store
      VALIDATOR_PATH: /data/validator.json
      LIGHTPOOL_PRIVATE_KEY: ${LIGHTPOOL_PRIVATE_KEY:-}

  clob-index:
    build:
      context: .
      dockerfile: Dockerfile.clob-index
      <<: *build-proxy
    container_name: lightpool-clob-index
    restart: unless-stopped
    depends_on:
      - node
    networks:
      - lightpool
    ports:
      - "${CLOB_PORT:-3002}:3002"
    volumes:
      - ${DATA_DIR:-./data}/clob-index:/data
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      LIGHTPOOL_RPC_URL: http://172.28.0.2:26300
      LIGHTPOOL_WS_URL: ws://172.28.0.2:26400
      LIGHTPOOL_MEMPOOL_ADDR: 172.28.0.2:26000
      ENABLE_INDEXER: "true"
      ENABLE_SQLITE: "true"
      SQLITE_PATH: /data/clob-index.sqlite3
      CHECKPOINT_INTERVAL_MS: "1000"
