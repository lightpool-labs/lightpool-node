<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="LightPool">
  <defs>
    <linearGradient id="wm-accent" x1="24" y1="24" x2="120" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DFFC0"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <rect x="8" y="16" width="128" height="128" rx="28" fill="#0B1F1C"/>
  <g fill="url(#wm-accent)">
    <rect x="31" y="56" width="16" height="56" rx="4"/>
    <rect x="53" y="44" width="16" height="68" rx="4"/>
    <rect x="75" y="64" width="16" height="48" rx="4"/>
    <rect x="97" y="50" width="16" height="62" rx="4"/>
  </g>

  <!-- Wordmark -->
  <text
    x="168"
    y="104"
    fill="#0B1F1C"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-1.5"
  >LightPool</text>
</svg>
